[build]
  publish = "."

# The New Space lecture moved from Nov 7 to Nov 8; keep the old links alive.
[[redirects]]
  from = "/lectures/20261107-newspace"
  to = "/lectures/20261108-newspace/"
  status = 301
  force = true

[[redirects]]
  from = "/lectures/20261107-newspace/*"
  to = "/lectures/20261108-newspace/:splat"
  status = 301
  force = true

# Basic security headers for a static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache long-lived static assets.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lectures/*/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
