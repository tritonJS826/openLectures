[build]
  command = "npm run build"
  publish = "dist"

# --- One URL per page --------------------------------------------------------
# Language is always part of the path, and the default language is RU.
[[redirects]]
  from = "/"
  to = "/ru/"
  status = 301
  # dist/index.html exists (Astro redirect stub), so force the rule to win.
  force = true

[[redirects]]
  from = "/index.html"
  to = "/ru/"
  status = 301
  force = true

# --- Sitemap ----------------------------------------------------------------
# Astro writes sitemap-index.xml; keep the old /sitemap.xml address working for
# search engines that already know it.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

# --- Legacy URLs (pre-Astro site) -------------------------------------------
[[redirects]]
  from = "/archive.html"
  to = "/ru/nis/archive/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/ru/about/"
  status = 301

[[redirects]]
  from = "/newLectureRequest.html"
  to = "/ru/nis/new-lecture/"
  status = 301

[[redirects]]
  from = "/lectures/:slug"
  to = "/ru/nis/lectures/:slug/"
  status = 301

[[redirects]]
  from = "/lectures/:slug/"
  to = "/ru/nis/lectures/:slug/"
  status = 301

# Old lecture assets (/lectures/<slug>/images/…) now live under the city folder.
[[redirects]]
  from = "/lectures/:slug/images/:file"
  to = "/lectures/nis/:slug/images/:file"
  status = 301

# Directory form with an explicit index.html → clean directory URL.
[[redirects]]
  from = "/:lang/:city/lectures/:slug/index.html"
  to = "/:lang/:city/lectures/:slug/"
  status = 301
  force = true

# --- Deploy contexts ---------------------------------------------------------
# Production builds the site with Astro. Previews append a generated _headers
# with X-Robots-Tag: noindex so a copy of the site on another hostname can't
# outrank the real one.
[context.deploy-preview]
  command = "npm run build && sh scripts/preview-headers.sh"

[context.branch-deploy]
  command = "npm run build && sh scripts/preview-headers.sh"

# Basic security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache long-lived build assets (CSS/JS bundles are content-hashed).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Lecture media and materials manifests.
[[headers]]
  for = "/lectures/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
